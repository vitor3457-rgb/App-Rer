<style>
  :root {
    /* Cores do logo da igreja: laranja, cinza da rocha e preto */
    --laranja: #ff8708;
    --laranja-escuro: #e87400;
    --laranja-clara: #fff0e0;
    --fundo: #f6f3f2;
    --cartao: #ffffff;
    --texto: #1c1716;
    --texto-suave: #6b5f5c;
    --borda: #d8cfcc;
    --primaria: #4f4643;          /* cinza-escuro da rocha */
    --primaria-escura: #3a3230;
    --primaria-clara: #ece6e4;
    --entrada: #1a7a38;
    --entrada-clara: #e3f4e8;
    --saida: #c0262d;
    --saida-clara: #fde9ea;
    --foco: #c45c00;
    --raio: 14px;
    --sombra: 0 1px 3px rgba(40, 28, 24, .08), 0 2px 10px rgba(40, 28, 24, .05);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    font-size: 18px;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { width: 24px; height: 24px; flex: none; }

  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }

  .visualmente-oculto {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ---------- Topo ---------- */
  .topo {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 5px solid var(--laranja);
    box-shadow: 0 2px 8px rgba(40, 28, 24, .08);
  }
  .topo-logo { height: 48px; width: auto; display: block; }
  .topo-textos { display: flex; flex-direction: column; line-height: 1.1; }
  .topo-titulo { font-size: 1.7rem; font-weight: 900; letter-spacing: 1.5px; color: var(--texto); }
  .topo-subtitulo { font-size: .85rem; font-weight: 600; color: var(--texto-suave); letter-spacing: .3px; }

  .conteudo { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  .titulo-tela { font-size: 1.45rem; margin: 4px 0 14px; }

  .cartao {
    background: var(--cartao);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    padding: 18px 16px;
  }

  /* ---------- Campos ---------- */
  .campo { margin-bottom: 20px; }
  .rotulo { display: block; font-weight: 700; margin-bottom: 8px; }
  .ajuda { color: var(--texto-suave); font-size: .95rem; margin-top: 6px; min-height: 1.3em; }

  .entrada {
    display: block; width: 100%;
    min-height: 56px;
    padding: 12px 14px;
    border: 2px solid var(--borda);
    border-radius: 12px;
    background: #fff;
    font-size: 1.1rem;
  }
  .entrada:focus { border-color: var(--laranja); outline: none; box-shadow: 0 0 0 3px var(--laranja-clara); }
  .entrada.com-erro { border-color: var(--saida); box-shadow: 0 0 0 3px var(--saida-clara); }

  .entrada-valor {
    font-size: 2.1rem; font-weight: 700; text-align: center;
    min-height: 72px; letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
  }
  .entrada-valor::placeholder { color: #a3a9b8; }

  /* ---------- Botões de escolha (Entrada/Saída, Dízimo/Oferta) ---------- */
  .grupo-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .botao-opcao {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 64px; padding: 10px;
    border: 2px solid var(--borda); border-radius: 12px;
    background: #fff; font-size: 1.15rem; font-weight: 700;
    transition: background .15s, border-color .15s, color .15s;
  }
  .botao-opcao.com-erro { border-color: var(--saida); }
  .opcao-entrada { color: var(--entrada); }
  .opcao-saida { color: var(--saida); }
  .opcao-categoria { color: var(--primaria); }
  .opcao-entrada[aria-pressed="true"] { background: var(--entrada); border-color: var(--entrada); color: #fff; }
  .opcao-saida[aria-pressed="true"] { background: var(--saida); border-color: var(--saida); color: #fff; }
  .opcao-categoria[aria-pressed="true"] { background: var(--primaria); border-color: var(--primaria); color: #fff; }

  .sugestoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .sugestoes:empty { display: none; }
  .rotulo-extra { font-weight: 500; color: var(--texto-suave); font-size: .9rem; }
  .sugestao {
    min-height: 44px; padding: 8px 14px;
    border: 1px solid var(--borda); border-radius: 22px;
    background: var(--fundo); font-size: 1rem;
  }

  /* ---------- Caixa de escolha do responsável ---------- */
  .combo { position: relative; }
  .combo-entrada { padding-right: 56px; font-weight: 700; }
  .combo-botao {
    position: absolute; top: 4px; right: 4px; bottom: 4px; width: 48px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 9px; background: var(--primaria-clara); color: var(--primaria);
  }
  .combo-botao svg { width: 30px; height: 30px; }
  .combo-lista {
    position: absolute; z-index: 15; left: 0; right: 0; top: calc(100% + 4px);
    margin: 0; padding: 6px; list-style: none;
    background: #fff; border: 2px solid var(--borda); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(40, 28, 24, .18);
    max-height: 280px; overflow-y: auto;
  }
  .combo-opcao {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 52px; padding: 10px 14px; border-radius: 9px;
    font-size: 1.1rem; font-weight: 600; cursor: pointer;
  }
  .combo-opcao[aria-selected="true"] { background: var(--laranja-clara); }
  .combo-opcao.ativa { background: var(--primaria-clara); }
  .combo-opcao .marca { color: var(--laranja-escuro); font-weight: 800; }
  .combo-vazio { padding: 12px 14px; color: var(--texto-suave); }

  /* ---------- Botões gerais ---------- */
  .botao {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 60px; padding: 12px 16px;
    border-radius: 12px; border: 2px solid transparent;
    font-size: 1.15rem; font-weight: 700;
  }
  .botao-principal {
    background: var(--laranja); color: var(--texto); font-size: 1.3rem; font-weight: 800; min-height: 64px;
    box-shadow: 0 2px 0 var(--laranja-escuro);
  }
  .botao-principal:active { background: var(--laranja-escuro); }
  .botao-principal:disabled { opacity: .7; cursor: wait; }
  .botao-secundario { background: #fff; color: var(--primaria); border-color: var(--primaria); margin-top: 16px; }
  .botao-perigo { background: var(--saida); color: #fff; }
  .botao-perigo:disabled, .botao-secundario:disabled { opacity: .6; }

  .mensagem-erro {
    margin: 0 0 16px; padding: 12px 14px;
    background: var(--saida-clara); color: #8c1219;
    border-left: 5px solid var(--saida); border-radius: 8px;
    font-weight: 600;
  }

  .usuario { text-align: center; color: var(--texto-suave); font-size: .9rem; margin-top: 22px; word-break: break-all; }
  .usuario strong { font-weight: 600; }

  /* ---------- Tela 2 ---------- */
  .barra-tela { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .barra-tela .titulo-tela { margin: 0; font-size: 1.3rem; }
  .botao-voltar {
    display: inline-flex; align-items: center; gap: 2px;
    min-height: 48px; padding: 6px 12px 6px 4px;
    border: none; border-radius: 10px; background: transparent;
    color: var(--primaria); font-weight: 700; font-size: 1.05rem;
  }

  .filtro { padding: 10px; margin: 10px 0 14px; }
  .filtro-linha { display: flex; align-items: center; gap: 8px; }
  .seletor {
    flex: 1; min-width: 0; padding: 10px 6px;
    font-weight: 700; font-size: 1.1rem; text-align: center;
  }
  .ano-fixo { flex: none; padding: 0 2px; font-weight: 700; font-size: 1.1rem; }
  .filtro-linha-ano { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .filtro-linha-ano .rotulo { margin: 0; }
  .botao-seta {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 56px; flex: none;
    border: 2px solid var(--borda); border-radius: 12px; background: #fff; color: var(--primaria);
  }
  .botao-seta:disabled { opacity: .35; }

  .exportar-rotulo { display: block; font-weight: 700; font-size: .95rem; color: var(--texto-suave); margin: -2px 0 6px 2px; }
  .exportar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; }
  .botao-exportar {
    min-height: 54px; padding: 8px 10px; gap: 8px; font-size: 1.1rem; white-space: nowrap;
    background: #fff; color: var(--primaria); border-color: var(--borda);
  }
  .botao-exportar:active { background: var(--primaria-clara); }
  .botao-exportar:disabled { opacity: .5; }

  .estado-lista { text-align: center; color: var(--texto-suave); padding: 0 8px; }
  .estado-lista:not(:empty) { padding: 28px 8px; }
  .estado-lista.erro { color: #8c1219; font-weight: 600; }
  .estado-lista .botao { margin-top: 14px; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    grid-template-areas: "data info valor" "data info excluir";
    column-gap: 10px; align-items: center;
    background: var(--cartao); border-radius: 12px; box-shadow: var(--sombra);
    padding: 10px 6px 6px 12px; margin-bottom: 10px;
    border-left: 6px solid var(--entrada);
  }
  .item.saida { border-left-color: var(--saida); }
  .item-data {
    grid-area: data; text-align: center; line-height: 1.1;
    color: var(--texto-suave); font-size: .85rem;
  }
  .item-data strong { display: block; color: var(--texto); font-size: 1.35rem; }
  .item-info { grid-area: info; min-width: 0; padding: 2px 0 4px; }
  .item-titulo { font-weight: 700; overflow-wrap: break-word; hyphens: auto; }
  .item-sub { color: var(--texto-suave); font-size: .85rem; overflow-wrap: break-word; }
  .item-valor {
    grid-area: valor; align-self: end; padding-right: 6px;
    font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap;
    font-size: 1.05rem;
  }
  .item .item-valor { color: var(--entrada); }
  .item.saida .item-valor { color: var(--saida); }
  .item-excluir {
    grid-area: excluir; justify-self: end; align-self: start;
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border: none; border-radius: 10px;
    background: transparent; color: var(--texto-suave);
  }
  .item-excluir:active { background: var(--saida-clara); color: var(--saida); }

  .resumo { margin-top: 6px; }
  .resumo-titulo { font-size: 1.15rem; margin: 0 0 10px; }
  .linha-resumo {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-top: 1px solid #e6e8ef;
    font-variant-numeric: tabular-nums;
  }
  .linha-resumo span:last-child { font-weight: 700; white-space: nowrap; }
  .linha-resumo.sub { padding-left: 14px; color: var(--texto-suave); font-size: 1rem; }
  .linha-resumo.sub span:last-child { color: var(--texto); }
  .cor-entrada { color: var(--entrada); font-weight: 700; }
  .cor-saida { color: var(--saida); font-weight: 700; }
  .linha-resumo.saldo {
    margin-top: 6px; padding: 14px 12px; border: none; border-radius: 10px;
    font-size: 1.2rem; font-weight: 800;
    background: var(--entrada-clara); color: var(--entrada);
  }
  .linha-resumo.saldo.negativo { background: var(--saida-clara); color: var(--saida); }

  /* ---------- Aviso rápido ---------- */
  .aviso {
    position: fixed; left: 16px; right: 16px; bottom: 20px; z-index: 20;
    max-width: 528px; margin: 0 auto;
    padding: 16px 18px; border-radius: 14px;
    background: #14532d; color: #fff; font-weight: 600;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
    display: flex; gap: 10px; align-items: flex-start;
    pointer-events: none; /* não bloqueia toques nos botões que ficam embaixo */
  }
  .aviso.erro { background: #8c1219; }
  .aviso svg { margin-top: 1px; }

  /* ---------- Confirmação ---------- */
  .modal-fundo {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(15, 18, 30, .55);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    width: 100%; max-width: 440px; background: #fff; border-radius: 18px;
    padding: 22px 18px 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }
  .modal h2 { margin: 0 0 12px; font-size: 1.3rem; }
  .modal-texto { background: var(--fundo); border-radius: 10px; padding: 12px 14px; line-height: 1.5; }
  .modal-alerta { color: var(--texto-suave); font-size: .95rem; margin: 12px 0 16px; }
  .modal-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-botoes .botao { margin: 0; }

  .girando { animation: girar 1s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .girando { animation: none; } * { transition: none !important; } }
</style>
