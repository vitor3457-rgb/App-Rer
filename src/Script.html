<script>
(function () {
  'use strict';

  var D = window.DADOS || {};
  var MESES = D.meses || [];
  var ANOS = (D.anos || []).slice().sort(function (a, b) { return a - b; });
  var MAX_CENTAVOS = D.valorMaximoCentavos || 100000000;
  var TEMPO_LIMITE_MS = 45000;

  var ICONE_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.4-1.4z" fill="currentColor"/></svg>';
  var ICONE_ERRO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v7h-2zm0 9h2v2h-2zM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z" fill="currentColor"/></svg>';
  var ICONE_LIXEIRA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7zm4 2v8h1.5v-8zm2.5 0v8H14v-8z" fill="currentColor"/></svg>';
  var ICONE_CARREGANDO = '<svg class="girando" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-6-6z" fill="currentColor"/></svg>';

  var estado = {
    centavos: 0,
    tipo: '',
    categoria: '',
    idPendente: '',
    salvando: false,
    ano: 0,
    mes: 0,
    pedidoLista: 0,
    itens: [],
    excluindo: null,
    responsavel: '',
    opcaoAtiva: -1,
    listaAtual: null,
    telaAtual: 'novo',
    historicoAtivo: false,
  };

  function $(id) { return document.getElementById(id); }

  // =====================================================================
  //  Utilitários
  // =====================================================================

  function doisDigitos(n) { return ('0' + n).slice(-2); }

  /** 123456 -> "R$ 1.234,56" */
  function formatarReais(centavos) {
    var negativo = centavos < 0;
    var abs = Math.abs(Math.round(centavos));
    var inteiro = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (negativo ? '- ' : '') + 'R$ ' + inteiro + ',' + doisDigitos(abs % 100);
  }

  function hojeISO() {
    var d = new Date();
    return d.getFullYear() + '-' + doisDigitos(d.getMonth() + 1) + '-' + doisDigitos(d.getDate());
  }

  /** "2026-11-08" -> "08/11/2026" */
  function dataBR(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return iso || '';
    return iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4);
  }

  /** "2026-11-08" -> "domingo, 8 de novembro de 2026" */
  function dataPorExtenso(iso) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!p) return '';
    var d = new Date(Number(p[1]), Number(p[2]) - 1, Number(p[3]));
    if (d.getMonth() !== Number(p[2]) - 1) return '';
    var semana = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
    return semana[d.getDay()] + ', ' + d.getDate() + ' de ' + (MESES[d.getMonth()] || '').toLowerCase() + ' de ' + d.getFullYear();
  }

  function gerarId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      try { return window.crypto.randomUUID(); } catch (e) { /* segue para o plano B */ }
    }
    var hex = '';
    var bytes = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
    for (var j = 0; j < 16; j++) hex += ('0' + bytes[j].toString(16)).slice(-2);
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
  }

  function escaparHtml(texto) {
    return String(texto === undefined || texto === null ? '' : texto)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** ['a', 'b', 'c'] -> "a, b ou c" */
  function listarNomes(nomes) {
    nomes = nomes.map(String);
    if (nomes.length <= 1) return nomes[0] || '';
    return nomes.slice(0, -1).join(', ') + ' ou ' + nomes[nomes.length - 1];
  }

  function listarAnos() { return listarNomes(ANOS); }

  /** Traduz falhas de comunicação para mensagens claras. */
  function mensagemDeFalha(erro) {
    var msg = erro && erro.message ? erro.message : String(erro || '');
    if (/network|failed to fetch|connection|conex|HTTP 0|offline/i.test(msg)) {
      return 'Sem conexão com a internet. Verifique o Wi-Fi ou os dados móveis e tente de novo.';
    }
    if (/authoriz|autoriza|permission|permiss/i.test(msg)) {
      return 'É preciso autorizar o app de novo. Feche e abra o app. Se continuar, fale com o responsável.';
    }
    if (/demorou/i.test(msg)) return msg;
    return 'Não foi possível falar com o servidor. Tente de novo. (Detalhe: ' + msg + ')';
  }

  /**
   * Chama uma função do servidor e devolve uma Promise.
   * A Promise resolve com a resposta { ok, ... } e rejeita só em falha de comunicação.
   */
  function servidor(nomeFuncao) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var terminou = false;
      var limite = setTimeout(function () {
        if (terminou) return;
        terminou = true;
        reject(new Error('O servidor demorou demais para responder. Verifique a internet e tente de novo.'));
      }, TEMPO_LIMITE_MS);
      try {
        var executor = google.script.run
          .withSuccessHandler(function (resposta) {
            if (terminou) return;
            terminou = true;
            clearTimeout(limite);
            resolve(resposta || { ok: false, erro: 'Resposta vazia do servidor. Tente de novo.' });
          })
          .withFailureHandler(function (erro) {
            if (terminou) return;
            terminou = true;
            clearTimeout(limite);
            reject(erro);
          });
        executor[nomeFuncao].apply(executor, args);
      } catch (e) {
        terminou = true;
        clearTimeout(limite);
        reject(e);
      }
    });
  }

  var temporizadorAviso = null;
  function mostrarAviso(html, tipo) {
    var aviso = $('aviso');
    aviso.className = 'aviso' + (tipo === 'erro' ? ' erro' : '');
    aviso.innerHTML = (tipo === 'erro' ? ICONE_ERRO : ICONE_OK) + '<div>' + html + '</div>';
    aviso.hidden = false;
    clearTimeout(temporizadorAviso);
    temporizadorAviso = setTimeout(function () { aviso.hidden = true; }, tipo === 'erro' ? 7000 : 4500);
  }

  // =====================================================================
  //  TELA 1 — Novo lançamento
  // =====================================================================

  var campoValor = $('valor');
  var campoDescricao = $('descricao');
  var campoContribuinte = $('contribuinte');
  var campoData = $('data');

  function cursorNoFim() {
    var fim = campoValor.value.length;
    try { campoValor.setSelectionRange(fim, fim); } catch (e) { /* alguns teclados não permitem */ }
  }

  /** Máscara de dinheiro: os números entram pela direita (1 → 0,01 → 0,12 → 1,23). */
  function aoDigitarValor() {
    var digitos = campoValor.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    estado.centavos = digitos ? parseInt(digitos, 10) : 0;
    campoValor.value = estado.centavos ? formatarReais(estado.centavos) : '';
    cursorNoFim();
    campoValor.classList.remove('com-erro');
    aoMudarFormulario();
  }

  function escolherTipo(tipo) {
    estado.tipo = tipo;
    document.querySelectorAll('[data-tipo]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-tipo') === tipo));
      b.classList.remove('com-erro');
    });
    $('bloco-categoria').hidden = tipo !== 'Entrada';
    $('bloco-contribuinte').hidden = tipo !== 'Entrada';
    $('bloco-descricao').hidden = tipo !== 'Saída';
    if (tipo !== 'Entrada') escolherCategoria('');
    aoMudarFormulario();
  }

  function escolherCategoria(categoria) {
    estado.categoria = categoria;
    document.querySelectorAll('[data-categoria]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-categoria') === categoria));
      b.classList.remove('com-erro');
    });
    $('contribuinte-opcional').hidden = categoria !== 'Oferta';
    aoMudarFormulario();
  }

  // ---------- Sugestões (despesas e nomes de quem contribuiu) ----------
  // Aparecem como botõezinhos embaixo do campo. Ao digitar, mostram só as que combinam.

  var MAX_SUGESTOES = 12;
  var sugestoes = { despesas: D.sugestoesDespesa || [], contribuintes: [] };

  function semAcentosSug(texto) {
    return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function mostrarSugestoes(campo, caixa, lista) {
    var termo = semAcentosSug(campo.value);
    var filtradas = (lista || []).filter(function (t) {
      var n = semAcentosSug(t);
      return !termo || (n.indexOf(termo) >= 0 && n !== termo);
    });
    filtradas.sort(function (a, b) {
      return (semAcentosSug(a).indexOf(termo) === 0 ? 0 : 1) - (semAcentosSug(b).indexOf(termo) === 0 ? 0 : 1);
    });
    caixa.innerHTML = '';
    filtradas.slice(0, MAX_SUGESTOES).forEach(function (texto) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sugestao';
      b.textContent = texto;
      b.addEventListener('click', function () {
        campo.value = texto;
        campo.classList.remove('com-erro');
        aoMudarFormulario();
        atualizarSugestoes();
      });
      caixa.appendChild(b);
    });
  }

  function atualizarSugestoes() {
    mostrarSugestoes(campoDescricao, $('sugestoes'), sugestoes.despesas);
    mostrarSugestoes(campoContribuinte, $('sugestoes-contribuinte'), sugestoes.contribuintes);
  }

  /** Depois de salvar, o texto novo já aparece como sugestão (no topo). */
  function lembrarSugestao(tipoLista, texto) {
    if (!texto) return;
    var chave = semAcentosSug(texto);
    var lista = sugestoes[tipoLista].filter(function (t) { return semAcentosSug(t) !== chave; });
    lista.unshift(texto);
    sugestoes[tipoLista] = lista;
  }

  // ---------- Responsável (caixa com lista que filtra ao digitar) ----------

  var RESPONSAVEIS = D.responsaveis || [];
  var campoResp = $('responsavel');
  var listaResp = $('lista-responsaveis');

  function semAcentos(texto) {
    return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  /** Nome exatamente como está na lista (sem diferenciar acento/maiúscula), ou ''. */
  function nomeDaLista(texto) {
    var alvo = semAcentos(texto);
    for (var i = 0; i < RESPONSAVEIS.length; i++) {
      if (semAcentos(RESPONSAVEIS[i]) === alvo) return RESPONSAVEIS[i];
    }
    return '';
  }

  function listaRespAberta() { return !listaResp.hidden; }

  function abrirResponsaveis(filtrar) {
    var termo = filtrar ? semAcentos(campoResp.value) : '';
    var nomes = RESPONSAVEIS.filter(function (n) { return !termo || semAcentos(n).indexOf(termo) >= 0; });
    // Quem começa com o que foi digitado aparece primeiro.
    nomes.sort(function (a, b) {
      return (semAcentos(a).indexOf(termo) === 0 ? 0 : 1) - (semAcentos(b).indexOf(termo) === 0 ? 0 : 1);
    });
    listaResp.innerHTML = '';
    nomes.forEach(function (nome, i) {
      var li = document.createElement('li');
      li.id = 'resp-opcao-' + i;
      li.className = 'combo-opcao';
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', String(nome === estado.responsavel));
      li.setAttribute('data-nome', nome);
      li.textContent = nome;
      li.addEventListener('mousedown', function (e) { e.preventDefault(); }); // não tira o foco do campo
      li.addEventListener('click', function () { escolherResponsavel(nome); });
      listaResp.appendChild(li);
    });
    if (!nomes.length) {
      var vazio = document.createElement('li');
      vazio.className = 'combo-vazio';
      vazio.textContent = 'Nenhum nome encontrado. Escolha um nome da lista.';
      listaResp.appendChild(vazio);
    }
    estado.opcaoAtiva = filtrar && nomes.length ? 0 : -1;
    marcarOpcaoAtiva();
    listaResp.hidden = false;
    campoResp.setAttribute('aria-expanded', 'true');
  }

  function fecharResponsaveis() {
    listaResp.hidden = true;
    campoResp.setAttribute('aria-expanded', 'false');
    campoResp.removeAttribute('aria-activedescendant');
  }

  function marcarOpcaoAtiva() {
    var opcoes = listaResp.querySelectorAll('.combo-opcao');
    opcoes.forEach(function (o, i) { o.classList.toggle('ativa', i === estado.opcaoAtiva); });
    if (estado.opcaoAtiva >= 0 && opcoes[estado.opcaoAtiva]) {
      campoResp.setAttribute('aria-activedescendant', opcoes[estado.opcaoAtiva].id);
      opcoes[estado.opcaoAtiva].scrollIntoView({ block: 'nearest' });
    } else {
      campoResp.removeAttribute('aria-activedescendant');
    }
  }

  function escolherResponsavel(nome) {
    estado.respAnterior = nome;
    campoResp.value = nome;
    estado.responsavel = nome;
    campoResp.classList.remove('com-erro');
    fecharResponsaveis();
    aoMudarFormulario();
    campoResp.blur();
  }

  function prepararResponsavel() {
    estado.responsavel = nomeDaLista(D.responsavelPadrao) || '';
    campoResp.value = estado.responsavel;

    // Ao tocar no campo, ele fica vazio (com o nome atual como dica) e a lista aparece
    // inteira; digitar filtra. Se sair sem escolher ninguém, o nome anterior volta.
    campoResp.addEventListener('focus', function () {
      estado.respAnterior = estado.responsavel;
      campoResp.placeholder = estado.responsavel || 'Digite ou escolha o nome';
      campoResp.value = '';
      abrirResponsaveis(false);
    });
    campoResp.addEventListener('click', function () { if (!listaRespAberta()) abrirResponsaveis(false); });
    campoResp.addEventListener('input', function () {
      estado.responsavel = nomeDaLista(campoResp.value);
      campoResp.classList.remove('com-erro');
      abrirResponsaveis(true);
      aoMudarFormulario();
    });
    campoResp.addEventListener('keydown', function (e) {
      var opcoes = listaResp.querySelectorAll('.combo-opcao');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!listaRespAberta()) abrirResponsaveis(false);
        var total = opcoes.length;
        if (!total) return;
        estado.opcaoAtiva = (estado.opcaoAtiva + (e.key === 'ArrowDown' ? 1 : -1) + total) % total;
        marcarOpcaoAtiva();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        var escolhida = opcoes[estado.opcaoAtiva >= 0 ? estado.opcaoAtiva : 0];
        if (escolhida && listaRespAberta()) escolherResponsavel(escolhida.getAttribute('data-nome'));
        else campoResp.blur();
      } else if (e.key === 'Escape') {
        fecharResponsaveis();
      }
    });
    campoResp.addEventListener('blur', function () {
      // Pequena espera para o toque numa opção da lista chegar antes de fechar.
      setTimeout(function () {
        if (document.activeElement === campoResp) return;
        fecharResponsaveis();
        campoResp.placeholder = 'Digite ou escolha o nome';
        if (!campoResp.value.trim() && estado.respAnterior) {
          campoResp.value = estado.respAnterior; // não escolheu ninguém: mantém quem estava
        }
        var nome = nomeDaLista(campoResp.value);
        estado.responsavel = nome;
        if (nome) campoResp.value = nome;
      }, 150);
    });
    $('abrir-responsaveis').addEventListener('mousedown', function (e) { e.preventDefault(); });
    $('abrir-responsaveis').addEventListener('click', function () {
      if (listaRespAberta()) { fecharResponsaveis(); campoResp.blur(); return; }
      if (document.activeElement === campoResp) abrirResponsaveis(false);
      else campoResp.focus();
    });
    document.addEventListener('click', function (e) {
      if (listaRespAberta() && !$('combo-responsavel').contains(e.target)) fecharResponsaveis();
    });
  }

  function atualizarDataExtenso() {
    $('data-extenso').textContent = dataPorExtenso(campoData.value);
  }

  /** Qualquer mudança no formulário gera um novo lançamento (novo ID) e limpa o erro. */
  function aoMudarFormulario() {
    estado.idPendente = '';
    $('erro-form').hidden = true;
  }

  function mostrarErroFormulario(mensagem, elemento) {
    var caixa = $('erro-form');
    caixa.textContent = mensagem;
    caixa.hidden = false;
    if (elemento) {
      elemento.classList.add('com-erro');
      if (elemento.focus && elemento.tagName === 'INPUT') elemento.focus();
    }
    caixa.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function validarFormulario() {
    if (!estado.responsavel) {
      return {
        erro: 'Escolha o responsável na lista (' + listarNomes(RESPONSAVEIS) + ').',
        elemento: campoResp,
      };
    }
    if (!estado.centavos || estado.centavos <= 0) {
      return { erro: 'Digite o valor (maior que zero).', elemento: campoValor };
    }
    if (estado.centavos > MAX_CENTAVOS) {
      return { erro: 'Valor muito alto. O máximo por lançamento é ' + formatarReais(MAX_CENTAVOS) + '.', elemento: campoValor };
    }
    if (!estado.tipo) {
      document.querySelectorAll('[data-tipo]').forEach(function (b) { b.classList.add('com-erro'); });
      return { erro: 'Escolha se é Entrada ou Saída.' };
    }
    if (estado.tipo === 'Entrada' && !estado.categoria) {
      document.querySelectorAll('[data-categoria]').forEach(function (b) { b.classList.add('com-erro'); });
      return { erro: 'Escolha se a entrada é Dízimo ou Oferta.' };
    }
    var descricao = campoDescricao.value.replace(/\s+/g, ' ').trim();
    if (estado.tipo === 'Saída' && !descricao) {
      return { erro: 'Escreva a descrição da despesa (ex.: aluguel, água, luz).', elemento: campoDescricao };
    }
    var contribuinte = campoContribuinte.value.replace(/\s+/g, ' ').trim();
    if (estado.tipo === 'Entrada' && estado.categoria === 'Dízimo' && !contribuinte) {
      return { erro: 'Escreva o nome de quem deu o dízimo.', elemento: campoContribuinte };
    }
    var data = campoData.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data) || !dataPorExtenso(data)) {
      return { erro: 'Escolha a data do lançamento.', elemento: campoData };
    }
    if (ANOS.indexOf(Number(data.slice(0, 4))) === -1) {
      return {
        erro: 'A data precisa ser de ' + listarAnos() + '. Para lançar em ' + data.slice(0, 4) +
          ', o ano precisa ser incluído nas configurações do app.',
        elemento: campoData,
      };
    }
    return {
      dados: {
        valorCentavos: estado.centavos,
        tipo: estado.tipo,
        categoria: estado.tipo === 'Entrada' ? estado.categoria : 'Despesa',
        // Na Entrada, a coluna Descrição guarda o nome de quem contribuiu.
        descricao: estado.tipo === 'Saída' ? descricao : contribuinte,
        dataReferencia: data,
        responsavel: estado.responsavel,
      },
    };
  }

  function limparFormulario() {
    estado.centavos = 0;
    campoValor.value = '';
    campoDescricao.value = '';
    campoContribuinte.value = '';
    campoData.value = hojeISO();
    escolherTipo('');
    document.querySelectorAll('.com-erro').forEach(function (el) { el.classList.remove('com-erro'); });
    atualizarDataExtenso();
    atualizarSugestoes();
    aoMudarFormulario();
  }

  function definirSalvando(sim) {
    estado.salvando = sim;
    var botao = $('botao-salvar');
    botao.disabled = sim;
    botao.innerHTML = sim ? ICONE_CARREGANDO + ' Salvando...' : 'Salvar';
  }

  function salvar(evento) {
    if (evento) evento.preventDefault();
    if (estado.salvando) return;
    $('erro-form').hidden = true;

    var v = validarFormulario();
    if (v.erro) {
      mostrarErroFormulario(v.erro, v.elemento);
      return;
    }

    // Mesmo ID se a pessoa tocar Salvar de novo sem mudar nada (evita duplicar).
    if (!estado.idPendente) estado.idPendente = gerarId();
    v.dados.id = estado.idPendente;

    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    definirSalvando(true);

    servidor('salvarLancamento', v.dados)
      .then(function (r) {
        definirSalvando(false);
        if (!r.ok) {
          mostrarErroFormulario(r.erro);
          return;
        }
        var d = v.dados;
        lembrarSugestao(d.tipo === 'Entrada' ? 'contribuintes' : 'despesas', d.descricao);
        var oQue = d.tipo === 'Entrada' ? d.categoria + (d.descricao ? ' de ' + d.descricao : '') : d.descricao;
        var resumo = escaparHtml(d.tipo) + ' · ' + escaparHtml(oQue) +
          ' · <strong>' + formatarReais(d.valorCentavos) + '</strong> · ' + dataBR(d.dataReferencia) +
          ' · ' + escaparHtml(d.responsavel);
        mostrarAviso((r.duplicado ? 'Este lançamento já estava salvo.' : 'Lançamento salvo!') + '<br>' + resumo);
        limparFormulario();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function (erro) {
        definirSalvando(false);
        // O ID é mantido: se a gravação chegou a acontecer, tentar de novo não duplica.
        estado.idPendente = v.dados.id;
        mostrarErroFormulario(mensagemDeFalha(erro));
      });
  }

  // =====================================================================
  //  TELA 2 — Lançamentos do mês
  // =====================================================================

  function prepararFiltros() {
    var selMes = $('filtro-mes');
    MESES.forEach(function (nome, i) {
      var op = document.createElement('option');
      op.value = String(i + 1);
      op.textContent = nome;
      selMes.appendChild(op);
    });

    var selAno = $('filtro-ano');
    ANOS.forEach(function (ano) {
      var op = document.createElement('option');
      op.value = String(ano);
      op.textContent = String(ano);
      selAno.appendChild(op);
    });
    // Com um ano só, o ano fica fixo; com mais anos, aparece a lista para escolher.
    $('linha-ano').hidden = ANOS.length <= 1;

    // Mês inicial: o mês atual (se o ano atual estiver disponível).
    var hoje = new Date();
    var anoAtual = hoje.getFullYear();
    if (ANOS.indexOf(anoAtual) >= 0) {
      estado.ano = anoAtual;
      estado.mes = hoje.getMonth() + 1;
    } else if (ANOS.length && anoAtual > ANOS[ANOS.length - 1]) {
      estado.ano = ANOS[ANOS.length - 1];
      estado.mes = 12;
    } else {
      estado.ano = ANOS[0];
      estado.mes = 1;
    }
    atualizarFiltros();

    selMes.addEventListener('change', function () { estado.mes = Number(selMes.value); atualizarFiltros(); carregarLista(); });
    selAno.addEventListener('change', function () { estado.ano = Number(selAno.value); atualizarFiltros(); carregarLista(); });
    $('mes-anterior').addEventListener('click', function () { mudarMes(-1); });
    $('mes-seguinte').addEventListener('click', function () { mudarMes(1); });
  }

  function atualizarFiltros() {
    $('filtro-mes').value = String(estado.mes);
    $('filtro-ano').value = String(estado.ano);
    $('ano-fixo').textContent = String(estado.ano);
    var primeiro = ANOS[0];
    var ultimo = ANOS[ANOS.length - 1];
    $('mes-anterior').disabled = estado.ano === primeiro && estado.mes === 1;
    $('mes-seguinte').disabled = estado.ano === ultimo && estado.mes === 12;
  }

  function mudarMes(passo) {
    var mes = estado.mes + passo;
    var ano = estado.ano;
    if (mes < 1) { mes = 12; ano--; }
    if (mes > 12) { mes = 1; ano++; }
    if (ANOS.indexOf(ano) === -1) return;
    estado.mes = mes;
    estado.ano = ano;
    atualizarFiltros();
    carregarLista();
  }

  function mostrarEstadoLista(html, classe) {
    var caixa = $('estado-lista');
    caixa.className = 'estado-lista' + (classe ? ' ' + classe : '');
    caixa.innerHTML = html;
  }

  function carregarLista() {
    var pedido = ++estado.pedidoLista;
    estado.listaAtual = null;
    definirExportacao(false);
    $('lista').innerHTML = '';
    $('resumo').hidden = true;
    mostrarEstadoLista(ICONE_CARREGANDO + '<div>Carregando lançamentos...</div>');

    servidor('listarLancamentos', estado.ano, estado.mes)
      .then(function (r) {
        if (pedido !== estado.pedidoLista) return; // a pessoa já trocou de mês
        if (!r.ok) {
          mostrarErroLista(r.erro);
          return;
        }
        mostrarLista(r);
      })
      .catch(function (erro) {
        if (pedido !== estado.pedidoLista) return;
        mostrarErroLista(mensagemDeFalha(erro));
      });
  }

  function mostrarErroLista(mensagem) {
    mostrarEstadoLista(escaparHtml(mensagem) +
      '<button type="button" class="botao botao-secundario" id="tentar-novamente">Tentar de novo</button>', 'erro');
    $('tentar-novamente').addEventListener('click', carregarLista);
  }

  function nomeCurto(email) {
    return String(email || '').split('@')[0];
  }

  function mostrarLista(r) {
    estado.itens = r.itens || [];
    estado.listaAtual = r;
    definirExportacao(true);
    var nomeMes = MESES[r.mes - 1] || '';
    var lista = $('lista');
    lista.innerHTML = '';

    if (!estado.itens.length) {
      mostrarEstadoLista('Nenhum lançamento em ' + escaparHtml(nomeMes) + ' de ' + r.ano + '.');
    } else {
      mostrarEstadoLista('');
    }

    estado.itens.forEach(function (item, indice) {
      var entrada = item.tipo === 'Entrada';
      var titulo = entrada
        ? item.categoria + (item.descricao ? ' · ' + item.descricao : '')
        : (item.descricao || item.categoria);
      var quem = item.responsavel || nomeCurto(item.usuario);
      var sub = (entrada ? 'Entrada' : 'Saída') + (quem ? ' · por ' + quem : '');

      var li = document.createElement('li');
      li.className = 'item ' + (entrada ? 'entrada' : 'saida');
      li.innerHTML =
        '<div class="item-data"><strong>' + escaparHtml(item.dataReferencia.slice(8, 10)) + '</strong>' +
          escaparHtml((MESES[Number(item.dataReferencia.slice(5, 7)) - 1] || '').slice(0, 3).toLowerCase()) + '</div>' +
        '<div class="item-info"><div class="item-titulo">' + escaparHtml(titulo) + '</div>' +
          '<div class="item-sub">' + escaparHtml(sub) + '</div></div>' +
        '<div class="item-valor">' + (entrada ? '+ ' : '- ') + formatarReais(item.valorCentavos) + '</div>';

      if (item.id) {
        var botao = document.createElement('button');
        botao.type = 'button';
        botao.className = 'item-excluir';
        botao.setAttribute('aria-label', 'Excluir ' + titulo + ' de ' + formatarReais(item.valorCentavos));
        botao.innerHTML = ICONE_LIXEIRA;
        botao.addEventListener('click', function () { pedirConfirmacaoExclusao(indice); });
        li.appendChild(botao);
      }
      lista.appendChild(li);
    });

    var t = r.totais || {};
    $('resumo-titulo').textContent = 'Resumo de ' + nomeMes + ' de ' + r.ano;
    $('t-dizimos').textContent = formatarReais(t.dizimos || 0);
    $('t-ofertas').textContent = formatarReais(t.ofertas || 0);
    $('t-entradas').textContent = formatarReais(t.entradas || 0);
    $('t-saidas').textContent = formatarReais(t.saidas || 0);
    $('t-saldo').textContent = formatarReais(t.saldo || 0);
    $('linha-saldo').classList.toggle('negativo', (t.saldo || 0) < 0);
    $('resumo').hidden = false;
  }

  // ---------- Exclusão ----------

  function pedirConfirmacaoExclusao(indice) {
    var item = estado.itens[indice];
    if (!item) return;
    estado.excluindo = item;
    var entrada = item.tipo === 'Entrada';
    $('modal-texto').innerHTML =
      '<div><strong>' + escaparHtml(item.tipo) + ' · ' + escaparHtml(entrada ? item.categoria + (item.descricao ? ' · ' + item.descricao : '') : item.descricao) + '</strong></div>' +
      '<div>Valor: <strong>' + formatarReais(item.valorCentavos) + '</strong></div>' +
      '<div>Data: ' + dataBR(item.dataReferencia) + '</div>' +
      (item.responsavel ? '<div>Responsável: ' + escaparHtml(item.responsavel) + '</div>' : '') +
      (item.usuario ? '<div>Conta usada: ' + escaparHtml(item.usuario) + '</div>' : '');
    $('modal-confirmar').disabled = false;
    $('modal-confirmar').innerHTML = 'Sim, excluir';
    $('modal-fundo').hidden = false;
    $('modal-cancelar').focus();
  }

  function fecharModal() {
    $('modal-fundo').hidden = true;
    estado.excluindo = null;
  }

  function confirmarExclusao() {
    var item = estado.excluindo;
    if (!item) return;
    var botao = $('modal-confirmar');
    botao.disabled = true;
    botao.innerHTML = ICONE_CARREGANDO + ' Excluindo...';

    servidor('excluirLancamento', item.id)
      .then(function (r) {
        fecharModal();
        if (!r.ok) {
          mostrarAviso(escaparHtml(r.erro), 'erro');
        } else {
          mostrarAviso('Lançamento excluído.');
        }
        carregarLista();
      })
      .catch(function (erro) {
        fecharModal();
        mostrarAviso(escaparHtml(mensagemDeFalha(erro)), 'erro');
      });
  }

  // ---------- Exportar para Excel e PDF ----------
  // As planilhas/relatórios são gerados aqui no celular, com bibliotecas abertas
  // baixadas da internet só quando necessário (versões fixas e conferidas por SRI).

  var CDNS = ['https://cdn.jsdelivr.net/npm/', 'https://unpkg.com/'];
  var BIBLIOTECAS = {
    xlsx: {
      arquivo: 'xlsx@0.18.5/dist/xlsx.mini.min.js',
      sri: 'sha384-6fBkVFQw1YKyYpZpKf7bguegzeJqso45fTePEWGNuVaGy70fxEhICA/yswrPjW4+',
      pronta: function () { return !!(window.XLSX && window.XLSX.utils); },
    },
    jspdf: {
      arquivo: 'jspdf@2.5.2/dist/jspdf.umd.min.js',
      sri: 'sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/',
      pronta: function () { return !!(window.jspdf && window.jspdf.jsPDF); },
    },
    autotable: {
      depende: 'jspdf',
      arquivo: 'jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js',
      sri: 'sha384-Xl/CUCfJbzsngMp0CFxkmF0VW/8C160IsGujqeQlIhaGxKz2+JsIGORFqtCPeldF',
      pronta: function () {
        return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
      },
    },
  };
  var carregamentos = {};

  function carregarBiblioteca(nome) {
    var b = BIBLIOTECAS[nome];
    if (b.pronta()) return Promise.resolve();
    if (!carregamentos[nome]) {
      var antes = b.depende ? carregarBiblioteca(b.depende) : Promise.resolve();
      carregamentos[nome] = antes
        .then(function () { return baixarScript(b, 0); })
        .catch(function (e) { delete carregamentos[nome]; throw e; });
    }
    return carregamentos[nome];
  }

  function baixarScript(b, indiceCdn) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = CDNS[indiceCdn] + b.arquivo;
      s.integrity = b.sri;
      s.crossOrigin = 'anonymous';
      s.async = true;
      s.onload = function () { if (b.pronta()) resolve(); else reject(new Error('incompleta')); };
      s.onerror = function () { s.remove(); reject(new Error('falhou')); };
      document.head.appendChild(s);
    }).catch(function () {
      if (indiceCdn + 1 < CDNS.length) return baixarScript(b, indiceCdn + 1);
      throw new Error('Não foi possível carregar a ferramenta de exportação. Verifique a internet e tente de novo.');
    });
  }

  function definirExportacao(habilitar) {
    $('exportar-excel').disabled = !habilitar;
    $('exportar-pdf').disabled = !habilitar;
  }

  function agoraBR() {
    var d = new Date();
    return doisDigitos(d.getDate()) + '/' + doisDigitos(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' +
      doisDigitos(d.getHours()) + ':' + doisDigitos(d.getMinutes());
  }

  function itensEmOrdem(r) {
    return (r.itens || []).slice().sort(function (a, b) {
      if (a.dataReferencia !== b.dataReferencia) return a.dataReferencia < b.dataReferencia ? -1 : 1;
      return (a.ordemLancamento || 0) - (b.ordemLancamento || 0);
    });
  }

  /** Data no formato do Excel (dias desde 30/12/1899). */
  function dataExcel(ano, mes, dia, hora, minuto, segundo) {
    return (Date.UTC(ano, mes - 1, dia, hora || 0, minuto || 0, segundo || 0) - Date.UTC(1899, 11, 30)) / 86400000;
  }

  function nomeArquivo(r, tipo, extensao) {
    var base = String(D.nomeApp || 'ADRER').replace(/[^A-Za-z0-9_-]+/g, '');
    return base + '-' + tipo + '-' + r.ano + '-' + doisDigitos(r.mes) + '.' + extensao;
  }

  function gerarExcel(r) {
    var X = window.XLSX;
    var cabecalho = ['ID', 'Data/hora do lançamento', 'Data de referência', 'Ano', 'Mês', 'Tipo',
      'Categoria', 'Descrição', 'Valor', 'Usuário', 'Responsável'];
    var linhas = [cabecalho];
    itensEmOrdem(r).forEach(function (i) {
      var dh = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/.exec(i.dataHoraISO || '');
      var dr = /^(\d{4})-(\d{2})-(\d{2})$/.exec(i.dataReferencia || '');
      linhas.push([
        i.id,
        dh ? dataExcel(+dh[1], +dh[2], +dh[3], +dh[4], +dh[5], +dh[6]) : '',
        dr ? dataExcel(+dr[1], +dr[2], +dr[3]) : (i.dataReferencia || ''),
        i.ano, i.mes, i.tipo, i.categoria, i.descricao,
        i.valorCentavos / 100,
        i.usuario, i.responsavel || '',
      ]);
    });
    var aba = X.utils.aoa_to_sheet(linhas);
    function formato(linha, coluna, z) {
      var c = aba[X.utils.encode_cell({ r: linha, c: coluna })];
      if (c && c.t === 'n') c.z = z;
    }
    for (var l = 1; l < linhas.length; l++) {
      formato(l, 1, 'dd/mm/yyyy hh:mm');
      formato(l, 2, 'dd/mm/yyyy');
      formato(l, 8, '#,##0.00');
    }
    aba['!cols'] = [38, 20, 14, 6, 5, 9, 10, 32, 12, 28, 13].map(function (w) { return { wch: w }; });
    aba['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: linhas.length - 1, c: cabecalho.length - 1 } }) };

    var t = r.totais || {};
    var resumo = X.utils.aoa_to_sheet([
      [D.nomeApp + ' - ' + D.nomeCompleto],
      ['Lançamentos de ' + MESES[r.mes - 1] + ' de ' + r.ano],
      [],
      ['Dízimos', (t.dizimos || 0) / 100],
      ['Ofertas', (t.ofertas || 0) / 100],
      ['Total de entradas', (t.entradas || 0) / 100],
      ['Total de saídas', (t.saidas || 0) / 100],
      ['Saldo do mês', (t.saldo || 0) / 100],
      [],
      ['Quantidade de lançamentos', t.quantidade || 0],
      ['Gerado em', agoraBR()],
      ['Gerado por', D.email || ''],
    ]);
    for (var k = 3; k <= 7; k++) {
      var c = resumo[X.utils.encode_cell({ r: k, c: 1 })];
      if (c) c.z = '"R$" #,##0.00';
    }
    resumo['!cols'] = [{ wch: 28 }, { wch: 22 }];

    var livro = X.utils.book_new();
    X.utils.book_append_sheet(livro, aba, 'Lançamentos');
    X.utils.book_append_sheet(livro, resumo, 'Resumo');
    var dados = X.write(livro, { bookType: 'xlsx', type: 'array', compression: true });
    return {
      blob: new Blob([dados], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
      nome: nomeArquivo(r, 'lancamentos', 'xlsx'),
    };
  }

  /** As fontes padrão do PDF só têm letras do português/europeu ocidental. */
  function textoPdf(texto) {
    return String(texto || '')
      .replace(/[\u2013\u2014]/g, '-').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
      .replace(/\u2026/g, '...').replace(/[^\u0000-\u00FF]/g, '');
  }

  function gerarPdf(r) {
    var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    var largura = doc.internal.pageSize.getWidth();
    var altura = doc.internal.pageSize.getHeight();
    var M = 14;
    var nomeMes = MESES[r.mes - 1];
    var t = r.totais || {};
    var VERDE = [26, 122, 56];
    var VERMELHO = [192, 38, 45];
    var ROCHA = [79, 70, 67];

    try { doc.addImage(D.logoPdf, 'PNG', M, 9, 31, 24.6); } catch (e) { /* sem logo, segue */ }
    var x = M + 37;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(28, 23, 22);
    doc.text(textoPdf(D.nomeApp), x, 17);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(107, 95, 92);
    doc.text(textoPdf(D.nomeCompleto), x, 23);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(28, 23, 22);
    doc.text(textoPdf('Relatório financeiro - ' + nomeMes + ' de ' + r.ano), x, 30.5);
    doc.setDrawColor(255, 135, 8); doc.setLineWidth(1.2);
    doc.line(M, 37, largura - M, 37);

    doc.autoTable({
      startY: 42,
      margin: { left: M, right: M },
      tableWidth: 105,
      theme: 'plain',
      styles: { fontSize: 11, cellPadding: 1.8, textColor: ROCHA },
      body: [
        ['Dízimos', formatarReais(t.dizimos || 0)],
        ['Ofertas', formatarReais(t.ofertas || 0)],
        ['Total de entradas', formatarReais(t.entradas || 0)],
        ['Total de saídas', formatarReais(t.saidas || 0)],
        ['Saldo do mês', formatarReais(t.saldo || 0)],
      ],
      columnStyles: { 1: { halign: 'right', fontStyle: 'bold' } },
      didParseCell: function (d) {
        var negativo = (t.saldo || 0) < 0;
        if (d.row.index === 2) d.cell.styles.textColor = VERDE;
        if (d.row.index === 3) d.cell.styles.textColor = VERMELHO;
        if (d.row.index === 4) {
          d.cell.styles.fontStyle = 'bold';
          d.cell.styles.textColor = negativo ? VERMELHO : VERDE;
          d.cell.styles.fillColor = negativo ? [253, 233, 234] : [227, 244, 232];
        }
      },
    });

    var itens = itensEmOrdem(r);
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 8,
      margin: { left: M, right: M, bottom: 18 },
      head: [['Data', 'Tipo', 'Categoria', 'Descrição / Nome', 'Responsável', 'Valor']],
      body: itens.map(function (i) {
        return [
          dataBR(i.dataReferencia), i.tipo, i.categoria, textoPdf(i.descricao),
          textoPdf(i.responsavel || nomeCurto(i.usuario)),
          (i.tipo === 'Entrada' ? '+ ' : '- ') + formatarReais(i.valorCentavos),
        ];
      }),
      styles: { fontSize: 9.5, cellPadding: 2, overflow: 'linebreak', textColor: [28, 23, 22] },
      headStyles: { fillColor: ROCHA, textColor: 255, fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [246, 243, 242] },
      columnStyles: {
        0: { cellWidth: 22 }, 1: { cellWidth: 16 }, 2: { cellWidth: 21 },
        4: { cellWidth: 27 }, 5: { cellWidth: 31, halign: 'right', fontStyle: 'bold' },
      },
      didParseCell: function (d) {
        if (d.section === 'head' && d.column.index === 5) d.cell.styles.halign = 'right';
        if (d.section === 'body' && d.column.index === 5) {
          d.cell.styles.textColor = itens[d.row.index].tipo === 'Entrada' ? VERDE : VERMELHO;
        }
      },
    });

    var paginas = doc.getNumberOfPages();
    var rodape = textoPdf('Gerado em ' + agoraBR() + ' por ' + (D.email || ''));
    for (var p = 1; p <= paginas; p++) {
      doc.setPage(p);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(107, 95, 92);
      doc.text(rodape, M, altura - 8);
      doc.text('Página ' + p + ' de ' + paginas, largura - M, altura - 8, { align: 'right' });
    }
    return { blob: doc.output('blob'), nome: nomeArquivo(r, 'relatorio', 'pdf') };
  }

  function baixarArquivo(blob, nome) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = nome;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 60000);
  }

  function exportar(tipo) {
    var r = estado.listaAtual;
    if (!r) {
      mostrarAviso('Aguarde a lista do mês terminar de carregar.', 'erro');
      return;
    }
    if (!(r.itens || []).length) {
      mostrarAviso('Não há lançamentos em ' + escaparHtml(MESES[r.mes - 1]) + ' de ' + r.ano + ' para exportar.', 'erro');
      return;
    }
    var inicio = Date.now();
    var botao = $(tipo === 'excel' ? 'exportar-excel' : 'exportar-pdf');
    var conteudoBotao = botao.innerHTML;
    botao.disabled = true;
    botao.innerHTML = ICONE_CARREGANDO + ' Preparando...';

    carregarBiblioteca(tipo === 'excel' ? 'xlsx' : 'autotable')
      .then(function () {
        // O navegador só deixa baixar logo depois do toque. Se a internet demorou,
        // pede para tocar de novo (agora já está tudo pronto e é instantâneo).
        if (Date.now() - inicio > 4000) {
          mostrarAviso('Tudo pronto! Toque de novo em "Exportar" para baixar o arquivo.');
          return;
        }
        var arquivo;
        try {
          arquivo = tipo === 'excel' ? gerarExcel(r) : gerarPdf(r);
        } catch (e) {
          throw new Error('Não foi possível gerar o arquivo. (Detalhe: ' + (e && e.message ? e.message : e) + ')');
        }
        baixarArquivo(arquivo.blob, arquivo.nome);
        mostrarAviso('Arquivo baixado: <strong>' + escaparHtml(arquivo.nome) + '</strong><br>' +
          'Ele fica na pasta Downloads do celular.');
      })
      .catch(function (e) {
        mostrarAviso(escaparHtml(e && e.message ? e.message : String(e)), 'erro');
      })
      .then(function () {
        botao.innerHTML = conteudoBotao;
        botao.disabled = !estado.listaAtual;
      });
  }

  // =====================================================================
  //  Navegação entre as telas (com o botão "voltar" do Android)
  // =====================================================================

  function exibirTela(tela) {
    estado.telaAtual = tela;
    $('tela-novo').hidden = tela !== 'novo';
    $('tela-lista').hidden = tela !== 'lista';
    window.scrollTo(0, 0);
    if (tela === 'lista') {
      carregarLista();
      // Já vai baixando as ferramentas de exportação, para o botão responder rápido.
      setTimeout(function () {
        carregarBiblioteca('xlsx').catch(function () {});
        carregarBiblioteca('autotable').catch(function () {});
      }, 800);
    }
  }

  function temHistorico() {
    return estado.historicoAtivo && window.google && google.script && google.script.history;
  }

  function irParaLista() {
    if (temHistorico()) {
      try { google.script.history.push({ tela: 'lista' }, {}, 'lista'); } catch (e) { estado.historicoAtivo = false; }
    }
    exibirTela('lista');
  }

  function voltarParaNovo() {
    if (temHistorico() && estado.telaAtual === 'lista') {
      // Volta uma página no histórico (o mesmo que o botão "voltar" do celular).
      // Se o navegador não deixar, volta direto e desliga o histórico.
      var reserva = setTimeout(function () {
        estado.historicoAtivo = false;
        exibirTela('novo');
      }, 600);
      estado.aguardandoVolta = reserva;
      try { window.history.back(); } catch (e) { /* a reserva resolve */ }
      return;
    }
    exibirTela('novo');
  }

  function prepararHistorico() {
    try {
      if (window.google && google.script && google.script.history) {
        google.script.history.replace({ tela: 'novo' }, {}, '');
        google.script.history.setChangeHandler(function (e) {
          clearTimeout(estado.aguardandoVolta);
          var tela = e && e.state && e.state.tela === 'lista' ? 'lista' : 'novo';
          if (!$('modal-fundo').hidden) fecharModal();
          if (tela !== estado.telaAtual) exibirTela(tela);
        });
        estado.historicoAtivo = true;
      }
    } catch (e) {
      estado.historicoAtivo = false;
    }
  }

  // =====================================================================
  //  Início
  // =====================================================================

  function iniciar() {
    $('email-usuario').textContent = D.email || '';
    prepararResponsavel();
    definirExportacao(false);
    $('exportar-excel').addEventListener('click', function () { exportar('excel'); });
    $('exportar-pdf').addEventListener('click', function () { exportar('pdf'); });

    campoValor.addEventListener('input', aoDigitarValor);
    campoValor.addEventListener('focus', function () { setTimeout(cursorNoFim, 0); });
    campoValor.addEventListener('click', cursorNoFim);

    document.querySelectorAll('[data-tipo]').forEach(function (b) {
      b.addEventListener('click', function () { escolherTipo(b.getAttribute('data-tipo')); });
    });
    document.querySelectorAll('[data-categoria]').forEach(function (b) {
      b.addEventListener('click', function () { escolherCategoria(b.getAttribute('data-categoria')); });
    });
    [campoDescricao, campoContribuinte].forEach(function (campo) {
      campo.addEventListener('input', function () {
        campo.classList.remove('com-erro');
        aoMudarFormulario();
        atualizarSugestoes();
      });
    });

    if (ANOS.length) {
      campoData.min = ANOS[0] + '-01-01';
      campoData.max = ANOS[ANOS.length - 1] + '-12-31';
    }
    campoData.value = hojeISO();
    campoData.addEventListener('input', function () { campoData.classList.remove('com-erro'); atualizarDataExtenso(); aoMudarFormulario(); });
    campoData.addEventListener('change', atualizarDataExtenso);
    atualizarDataExtenso();

    // "Enter" no teclado fecha o teclado em vez de salvar sem querer.
    [campoValor, campoDescricao, campoContribuinte].forEach(function (campo) {
      campo.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); campo.blur(); }
      });
    });

    $('form-lancamento').addEventListener('submit', salvar);
    $('ir-lista').addEventListener('click', irParaLista);
    $('voltar').addEventListener('click', voltarParaNovo);
    $('voltar-rodape').addEventListener('click', voltarParaNovo);
    $('modal-cancelar').addEventListener('click', fecharModal);
    $('modal-confirmar').addEventListener('click', confirmarExclusao);
    $('modal-fundo').addEventListener('click', function (e) { if (e.target === $('modal-fundo')) fecharModal(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('modal-fundo').hidden) fecharModal();
    });

    prepararFiltros();
    prepararHistorico();

    // Sugestões: mostra as do Config na hora e depois atualiza com as mais usadas.
    atualizarSugestoes();
    servidor('obterSugestoes')
      .then(function (r) {
        if (r.ok) {
          sugestoes.despesas = r.despesas || sugestoes.despesas;
          sugestoes.contribuintes = r.contribuintes || [];
          atualizarSugestoes();
        } else {
          mostrarAviso(escaparHtml(r.erro), 'erro');
        }
      })
      .catch(function () { /* sem internet agora: as sugestões padrão já estão na tela */ });
  }

  iniciar();
})();
</script>
